<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not Your Gig — Proof > Resume</title>
    <script>
      // Resolve the theme before first paint so there is no light => dark
      // flash for persisted/system-dark users. A saved preference always wins;
      // otherwise fall back to the OS `prefers-color-scheme`.
      try {
        var saved = localStorage.getItem("nyg-theme");
        var dark = saved
          ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
